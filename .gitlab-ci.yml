include:
  - project: rayprosoft/tgs-ci-scripts
    ref: main
    file: GitLab/Templates/gitlab-job-templates.yml

variables:
  ImageName: pgtgs/brand-cert-api
  TgsSettingKey: brand-cert-api
  HelmTemplateFolderName: brand-cert-api
  BuildCacheKey: Tgs.Brand-Cert.$CI_PIPELINE_IID

stages:
  - build
  - test
  - publish
  - deploy-dev
  - deploy-staging
  - deploy-prod

build-code:
  extends: .build-code-template

unit-test:
  extends: .unit-test-template

push-nuget:
  stage: publish
  needs:
    - unit-test
  only:
    - main
  cache:
    key: $BuildCacheKey
    untracked: true
    policy: pull
  script:
    - dotnet pack -c $BuildConfiguration "Tgs.BrandCertificateClient/Tgs.BrandCertificateClient.csproj"
    - dotnet nuget push "Tgs.BrandCertificateClient/bin/$BuildConfiguration/*.nupkg" -s "raypro-baget" -k $NugetApiKey --skip-duplicate
  artifacts:
    name: Nuget
    untracked: false
    expire_in: "30 days"
    paths:
      - Tgs.BrandCertificateClient/bin/$BuildConfiguration/*.nupkg


push-docker-image:
  extends: .push-docker-image-template
  variables:
    project: Tgs.BrandCertificateService/Tgs.BrandCertificateService.csproj

push-k8s-template:
  extends: .push-k8s-template

.brand-cert-deploy:
  extends: .deploy-template
  script:
    - export resources=$(kubectl get cm resources-setting -o jsonpath={.data.$TgsSettingKey})
    - export dedicated=$(kubectl get cm tgs-settings -o jsonpath={.data.dedicated})
    - export node_selector=$(kubectl get cm tgs-settings -o jsonpath={.data.node-selector})
    - export autoscaling=$(kubectl get cm autoscaling-setting -o jsonpath={.data.$TgsSettingKey})
    - |
      cat << EOF | yq e -P | helm template artifacts/k8s/$HelmTemplateFolderName \
        -n $namespace \
        --name-template tgs \
        -f - 
      {
        "replicaCount": $replica,
        "nodeSelector": $node_selector,
        "tolerations": [$dedicated],
        "resources": $resources,
        "autoscaling": $autoscaling,
        "ingress": {
          "enabled": true,
          "hosts": [{
            "host": "$ingress_host",
            "paths": [{"path":"/", "pathType": "Prefix"}]
          }],
          "tls": [{
            "secretName": "$ingress_host",
            "hosts": ["$ingress_host"]
          }]
        }
      }
      EOF
    - |
      cat << EOF | yq e -P | helm template artifacts/k8s/$HelmTemplateFolderName \
        -n $namespace \
        --name-template tgs \
        -f - \
        | kubectl -n $namespace apply -f -
      {
        "replicaCount": $replica,
        "nodeSelector": $node_selector,
        "tolerations": [$dedicated],
        "resources": $resources,
        "autoscaling": $autoscaling,
        "ingress": {
          "enabled": true,
          "hosts": [{
            "host": "$ingress_host",
            "paths": [{"path":"/", "pathType": "Prefix"}]
          }],
          "tls": [{
            "secretName": "$ingress_host",
            "hosts": ["$ingress_host"]
          }]
        }
      }
      EOF

deploy-dev:
  extends: .brand-cert-deploy
  variables:
    namespace: dev
    kube_config: KubeConfig_Raypro_dev
    ingress_host: dev-brand-cert.rpgp.cc
  environment:
    name: dev
  stage: deploy-dev
  needs:
    - push-docker-image
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: always

deploy-staging:
  extends: .brand-cert-deploy
  variables:
    namespace: staging
    kube_config: KubeConfig_Raypro_staging
    ingress_host: stg-brand-cert.rpgp.cc
  environment:
    name: staging
  stage: deploy-staging
  needs:
    - deploy-dev
    - job: push-k8s-template
      artifacts: true
  only:
    - main

deploy-prod:
  extends: .brand-cert-deploy
  variables:
    namespace: prod
    kube_config: KubeConfig_Raypro_prod
    ingress_host: brand-cert.rpgp.cc
  environment:
    name: prod
  stage: deploy-prod
  needs:
    - deploy-staging
    - job: push-k8s-template
      artifacts: true
  only:
    - main
  when: manual
