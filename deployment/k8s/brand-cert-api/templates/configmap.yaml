apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "brand-cert-api.fullname" . }}
data:
  appsettings.json: |
    {
    }
  monitor.settings.json: |
    {
      "Logging":{
        "Console": {
          "FormatterName": "json"
        },
        "LogLevel": {
          "Default": "Warning",
          "Microsoft": "Warning",
          "Microsoft.Diagnostics": "Warning",
          "Microsoft.Hosting.Lifetime": "Information"
        }
      }
    }
